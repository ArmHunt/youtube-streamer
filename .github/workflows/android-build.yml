name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check system resources
        run: |
          free -h
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          pip list 2>/dev/null | grep -iE "buildozer|cython"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv openjdk-17-jdk-headless zip unzip ant wget

      - name: Accept Android SDK licenses before buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Download SDK command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O /tmp/cmdline-tools.zip
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          
          # Move to proper location
          mkdir -p ~/.android/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools ~/.android/cmdline-tools/latest
          
          # Accept all licenses automatically
          yes | ~/.android/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | head -20
          
          # Install required SDK components
          ~/.android/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653" 2>&1 | head -20
          
          echo "✅ SDK licenses accepted and components installed"

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          echo "=== Starting build ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          
          # Set environment variables to use manually installed SDK
          export ANDROID_HOME=$HOME/.android
          export ANDROID_SDK_ROOT=$HOME/.android
          export ANDROID_NDK_ROOT=$HOME/.android/ndk/25.2.9519653
          
          # Run buildozer
          buildozer android debug 2>&1 | tee build.log
          
          echo "=== Searching for APK ==="
          APK=$(find . -name "*.apk" -type f 2>/dev/null | grep -v ".buildozer/dists" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            echo "✅ APK found: $(ls -lh output.apk)"
          else
            echo "❌ No APK found"
            tail -30 build.log 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== FAILURE ==="
          tail -50 build.log 2>/dev/null || echo "No log"
