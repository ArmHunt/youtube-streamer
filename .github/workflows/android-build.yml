name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check system resources
        run: |
          free -h
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          pip list 2>/dev/null | grep -iE "buildozer|cython"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv openjdk-17-jdk-headless zip unzip ant wget libtool-bin

      - name: Download and setup Android SDK with licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Create SDK directory structure (Buildozer expects tools/ path)
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # Download SDK command-line tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # Create symlink from tools/ -> cmdline-tools/latest (Buildozer expects tools/bin/sdkmanager)
          ln -sfn cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools
          
          # Create licenses directory and accept SDK license
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Accept NDK license
          echo "848a17b737ae27973d196a7191a98d34100bb0c9" > ~/.buildozer/android/platform/android-sdk/licenses/android-ndk-license
          
          # Verify SDK installation
          export PATH=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$PATH
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          
          echo "✅ SDK command-line tools installed"
          ls -la $HOME/.buildozer/android/platform/android-sdk/tools/bin/
          sdkmanager --version
          
          # Install required SDK components
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "cmdline-tools;latest" "platform-tools" 2>&1 | tail -10
          
          # Verify all components
          sdkmanager --list 2>&1 | head -20

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          echo "=== Starting build ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b
          
          # Run buildozer
          buildozer android debug 2>&1 | tee build.log
          
          echo "=== Searching for APK ==="
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            echo "✅ APK found: $(ls -lh output.apk)"
          else
            echo "❌ No APK found"
            tail -30 build.log 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== FAILURE ==="
          tail -50 build.log 2>/dev/null || echo "No log"
