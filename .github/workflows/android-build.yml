name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup swap space (8GB)
        run: |
          fallocate -l 8G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo "Memory status:"
          free -h
          echo "Swap status:"
          swapon --show

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          echo "Installed packages:"
          pip list | grep -iE "buildozer|cython|kivy"

      - name: Install Android SDK/NDK via buildozer
        run: |
          cd ${{ github.workspace }}
          # Let buildozer handle SDK/NDK installation automatically
          buildozer android debug dep 2>&1 | tail -20
          
          echo "Verifying Android SDK setup..."
          ls -la ~/.buildozer/android/platform/ 2>/dev/null || echo "Buildozer platform dir not found"
          
          # Find installed NDK version
          NDK_VER=$(find ~/.buildozer/android/platform -name "android-ndk-*" -type d 2>/dev/null | head -1)
          if [ -n "$NDK_VER" ]; then
            NDK_VERSION=$(basename "$NDK_VER" | sed 's/android-ndk-//')
            export ANDROID_NDK_ROOT="$NDK_VER"
            echo "Found NDK: $NDK_VERSION"
          fi

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          
          echo "Starting APK build..."
          echo "Disk space:"
          df -h /
          echo "Memory:"
          free -h
          
          # Run buildozer with verbose output
          buildozer android debug 2>&1 | tee build.log
          
          echo "Build process finished. Searching for APK..."
          find . -name "*.apk" -type f 2>/dev/null
          
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            echo "✅ APK found and copied!"
            ls -lh output.apk
          else
            echo "⚠️ APK not found"
            echo "Searching in .buildozer:"
            find .buildozer -name "*.apk" 2>/dev/null | head -5
            echo "Build log tail:"
            tail -50 build.log 2>/dev/null
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== Build Log (last 100 lines) ==="
          tail -100 build.log 2>/dev/null || echo "No build log found"
