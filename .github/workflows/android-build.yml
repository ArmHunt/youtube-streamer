name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          python -m buildozer init --help 2>&1 | head -5

      - name: Setup Android SDK/NDK
        run: |
          mkdir -p $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          cd $HOME
          if [ ! -d $HOME/android-sdk/cmdline-tools/latest ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /dev/null || \
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest-11076708_latest.zip -o /dev/null
            unzip -q commandlinetools-linux-*.zip -d $HOME/android-sdk/ 2>/dev/null || true
            mkdir -p $HOME/android-sdk/cmdline-tools
            if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
              mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            elif [ -d "$HOME/android-sdk/cmdline-tools/bin" ]; then
              mv "$HOME/android-sdk/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            fi
          fi
          
          if [ -d "$HOME/android-sdk/cmdline-tools/latest/bin" ]; then
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" >/dev/null 2>&1
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" >/dev/null 2>&1
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" >/dev/null 2>&1
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" >/dev/null 2>&1
          fi
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          buildozer android debug 2>&1 | tee build.log
          
          echo "Searching for APK..."
          find . -name "*.apk" -type f 2>/dev/null
          
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            ls -lh output.apk
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30
