name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check system resources
        run: |
          free -h
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          pip list 2>/dev/null | grep -iE "buildozer|cython"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv openjdk-17-jdk-headless zip unzip ant wget

      - name: Pre-accept Android SDK licenses
        run: |
          # Create the license file that Buildozer's SDK will look for
          # This is the hash for accepting the Android SDK license
          mkdir -p ~/.android
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Write the Android SDK license hash (this is the standard accepted license)
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Also create the NDK license if it exists
          if [ -d ~/.buildozer/android/platform/android-ndk-r25b ]; then
            echo "848a17b737ae27973d196a7191a98d34100bb0c9" > ~/.buildozer/android/platform/android-sdk/licenses/android-ndk-license 2>/dev/null || true
          fi
          
          # Set up android home for Buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          echo "✅ Android SDK licenses pre-accepted"
          echo "License file: ~/.buildozer/android/platform/android-sdk/licenses/"
          ls -la ~/.buildozer/android/platform/android-sdk/licenses/

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          echo "=== Starting build ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          
          # Set NDK path after Buildozer installs it
          export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b
          
          # Run buildozer - it will use the SDK we just set up
          buildozer android debug 2>&1 | tee build.log
          
          echo "=== Searching for APK ==="
          APK=$(find . -name "*.apk" -type f 2>/dev/null | grep -v ".buildozer/dists" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            echo "✅ APK found: $(ls -lh output.apk)"
          else
            echo "❌ No APK found"
            tail -30 build.log 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== FAILURE ==="
          tail -50 build.log 2>/dev/null || echo "No log"
