name: Build YouTube Streamer APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup swap space
        run: |
          fallocate -l 8G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          free -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          python -m buildozer init --help 2>&1 | head -3

      - name: Install Android SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv openjdk-17-jdk-headless zip unzip
          sudo apt-get install -y ant
          
          mkdir -p $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/
          
          # Handle zip structure
          if [ -d "$HOME/android-sdk/cmdline-tools/cmdline-tools" ]; then
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          else
            mv "$HOME/android-sdk/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          rm -f cmdline-tools.zip
          
          if [ -d "$HOME/android-sdk/cmdline-tools/latest/bin" ]; then
            yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0"
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
            $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"
          fi

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_ROOT=$HOME/android-sdk/ndk/25.2.9519653
          
          echo "Build starting..."
          echo "Available memory:"
          free -h
          echo "Available disk:"
          df -h /
          
          buildozer android debug 2>&1 | tee build.log
          
          echo "Build completed. Looking for APK..."
          find . -name "*.apk" -type f 2>/dev/null
          
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" output.apk
            ls -lh output.apk
            echo "✅ APK ready!"
          else
            echo "⚠️ APK not found in expected locations"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-streamer-apk
          path: output.apk
          retention-days: 30
